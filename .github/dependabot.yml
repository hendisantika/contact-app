version: 2
updates:
  # Backend (Spring Boot / Maven)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    cooldown:
      default-days: 3
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      maven-minor-patch:
        update-types:
          - minor
          - patch

  # Frontend (React / npm)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    cooldown:
      default-days: 3
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
      testing-library:
        patterns:
          - "@testing-library/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker Compose images (PostgreSQL)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    assignees:
      - hendisantika
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
      include: scope
